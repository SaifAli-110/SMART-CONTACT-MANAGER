<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="normal/base :: layout(~{::section})">

<head>
    <meta charset="UTF-8">
    <title>th:text="${title}"</title>
</head>

<body>

<section class="edit-profile-section">

    <div class="edit-profile-container">

        <div class="edit-profile-header">
            <h2>Edit Profile</h2>
            <p>Update your personal information</p>
        </div>

        <div class="edit-profile-card">

            <!-- Error Message -->
            <div class="message error-message"
                 th:if="${errorMessage}"
                 th:text="${errorMessage}">
            </div>

            <!-- Profile Form -->
            <form th:action="@{/api/users/update-profile}"
                  th:object="${user}"
                  method="post"
                  enctype="multipart/form-data">

                <!-- Profile Image -->
                <div class="edit-image-container">

                    <img th:if="${user.userImageUrl != null
                                 and !#strings.isEmpty(user.userImageUrl)}"
                         th:src="@{'/images/' + ${user.userImageUrl}}"
                         alt="Profile Image"
                         class="edit-profile-image">

                    <img th:unless="${user.userImageUrl != null
                                     and !#strings.isEmpty(user.userImageUrl)}"
                         th:src="@{/images/contacts.png}"
                         alt="Default Profile"
                         class="edit-profile-image">

                    <label for="userImage" class="image-upload-label">
                        Change Profile Picture
                    </label>

                    <input type="file"
                           id="userImage"
                           name="userImage"
                           accept=".jpg,.jpeg,.png,.webp">
                </div>

                <!-- Full Name -->
                <div class="form-group">
                    <label for="userName">Full Name</label>

                    <input type="text"
                           id="userName"
                           th:field="*{userName}"
                           placeholder="Enter your full name"
                           minlength="3"
                           maxlength="20"
                           required>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="userEmail">Email Address</label>

                    <input type="email"
                           id="userEmail"
                           th:field="*{userEmail}"
                           placeholder="Enter your email address"
                           required>
                </div>

                <!-- New Password -->
                <div class="form-group">
                    <label for="userPassword">New Password</label>

                    <input type="password"
                           id="userPassword"
                           name="userPassword"
                           placeholder="Leave blank to keep current password"
                           autocomplete="new-password">

                    <small>
                        Leave this field empty if you do not want to
                        change your password.
                    </small>
                </div>

                <!-- About Me -->
                <div class="form-group">
                    <label for="userAbout">About Me</label>

                    <textarea id="userAbout"
                              th:field="*{userAbout}"
                              rows="5"
                              maxlength="500"
                              placeholder="Tell us something about yourself">
                    </textarea>
                </div>

                <!-- Buttons -->
                <div class="edit-profile-actions">

                    <button type="submit" class="save-btn">
                        Save Changes
                    </button>

                    <a th:href="@{/api/users/profile}"
                       class="cancel-btn">
                        Cancel
                    </a>

                </div>

            </form>

        </div>
    </div>

</section>

</body>
</html>
