<!--  link CSS file-->

<!--This is navbar starting-->
<nav class="navbar-con">
  <div class="nav-container">

    <!-- Brand Logo -->
    <a href="#" th:href="@{/api/users/dashboard}"  class="brand-logo">
      <i class="fa-solid fa-address-book"></i> SmartContact
    </a>

    <!-- Mobile Toggle Button -->
    <div class="menu-toggle" id="mobile-menu">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </div>

    <!-- Navigation Links -->
    <ul class="nav-menu">
      <li class="nav-item">
        <a th:href="@{/api/users/dashboard}" class="nav-link active">
          <i class="fa-solid fa-house"></i> Home
        </a>
      </li>

      <li class="nav-item">
        <a th:href="@{/api/users/contact-us}" class="nav-link">
          <i class="fa-solid fa-user-plus"></i> Contact-Us
        </a>
      </li>

<!--      for sign-in-->
      <li class="nav-item">
        <a class="nav-link" th:href="@{/api/users/profile}">
          <i class="fa-solid fa-user-lock"></i> <span th:text="${user.userName}"></span>
        </a>
      </li>
    </ul>
  </div>

</nav>
<!--This is navbar Ending-->

  <!-- Sidebar -->
  <div class="sidebar">
    <span onclick="toggleSideBar()" class="close-btn">&times;</span>
    <a href="#" th:href="@{/api/users/dashboard}"
          class="sidebarItem"
          th:classappend="${currentUrl == '/api/users/dashboard'} ? ' active' : ''">
      <i  class="fas fa-home"></i> Home
    </a>
    <a href="#" th:href="@{/api/users/view-contact/0}"  class="sidebarItem"><i class="fas fa-users"></i> View Contacts</a>
    <a href="#" th:href="@{/api/users/add-contact}" class="sidebarItem"><i class="fas fa-user-plus"></i> Add Contacts</a>
    <a href="#" th:href="@{/api/users/profile}" class="sidebarItem"><i class="fas fa-user"></i> Your Profile</a>
    <a href="#" class="sidebarItem"><i class="fas fa-cog"></i> Setting</a>
    <a href="#" th:href="@{/api/users/Help}" class="sidebarItem"><i class="fas fa-question-circle"></i> Help</a>
    <a href="#" th:href="@{/logout}" class="sidebarItem"><i class="fas fa-sign-out-alt"></i> Logout</a>
  </div>

  <!-- Content Area -->
  <div class="content">
    <i onclick="toggleSideBar()" class="fas fa-bars"></i>
    <div th:replace="${content}"></div>
  </div>
